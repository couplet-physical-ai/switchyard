# Roadrunner CI: the release shell (GitHub workflow `run:` blocks, scripts/release*) parses with
# bash -n and never expands a possibly-empty array unguarded under `set -u` (the macOS runner's
# bash 3.2 fails on it; that broke the v0.1.0 publish). scripts/ci/check_release_shell.py, stdlib.
labels:
  tier: "0"
when:
  - event: pull_request
    path:
      include: [".github/**", "scripts/release*", "scripts/release/**", "scripts/ci/check_release_shell.py", ".woodpecker/release-lint.yaml"]
  - event: push
    branch: main
    path:
      include: [".github/**", "scripts/release*", "scripts/release/**", "scripts/ci/check_release_shell.py", ".woodpecker/release-lint.yaml"]
  - event: manual
    branch: main
steps:
  - name: release-shell
    image: bash
    commands:
      - >-
        ci-dagger v0.14.1 python-plain --src=. --repo="$${CI_REPO_NAME,,}" --python=3.12
        --run='python3 scripts/ci/check_release_shell.py'
