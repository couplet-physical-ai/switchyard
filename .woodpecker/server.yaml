# Roadrunner CI (Woodpecker + Dagger, https://cicd.apps.example.com) for switchyard-server (server/):
# cargo fmt --check, clippy -D warnings, the test suite (unit, property, golden, replay), and a
# criterion smoke (every bench body runs once in test mode). Runs only when server/, contract/ or
# this file changes. `$$` escapes `$` for Woodpecker. Docs: https://cicd.docs.example.com/roadrunner/
labels:
  tier: "0"
when:
  - event: pull_request
    path:
      include: ["server/**", "contract/**", ".woodpecker/server.yaml"]
  - event: push
    branch: main
    path:
      include: ["server/**", "contract/**", ".woodpecker/server.yaml"]
  - event: manual
    branch: main
steps:
  - name: server
    image: bash
    commands:
      - >-
        ci-dagger v0.14.1 rust --src=. --repo="$${CI_REPO_NAME,,}" --dir=server
        --run='cargo fmt --all -- --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked && cargo bench --locked --bench core -- --test'
        --dep-cache=registry.dev.example.com/cache
        --dep-cache-password=file:///etc/ci/dep-cache --test-workers=4
