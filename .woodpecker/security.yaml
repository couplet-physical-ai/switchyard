# Roadrunner security scan for a PUBLIC repo: gitleaks over the whole tree (org-default
# allowlist plus .gitleaks.toml) and an osv-scanner dependency audit (report-only) on every
# pull request and push to main; the result is the `ci/woodpecker/<event>/security` check.
# Docs: https://cicd.docs.example.com/roadrunner/
labels:
  tier: "0"
when:
  - event: pull_request
  - event: [push, manual]
    branch: main
steps:
  - name: security-scan
    image: bash
    commands:
      - ci-dagger v0.14.1 security-scan --src=. --repo="$$CI_REPO"
