# The wire contract's fixtures (contract/fixtures/) are well-formed and match contract/CONTRACT.md's
# shapes (scripts/ci/validate_fixtures.py, stdlib only). Runs only when contract/ or the validator changes.
name: contract
on:
  pull_request:
    paths: ["contract/**", "scripts/ci/**", ".github/workflows/contract.yml"]
  push:
    branches: [main]
    paths: ["contract/**", "scripts/ci/**", ".github/workflows/contract.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fixtures:
    name: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/ci/validate_fixtures.py contract
